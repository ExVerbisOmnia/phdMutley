services:
  db:
    image: postgres:18
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: phdmutley
      POSTGRES_DB: climate_litigation
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phdmutley -d climate_litigation"]
      interval: 5s
      timeout: 5s
      retries: 5

  export:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles:
      - export
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://phdmutley:${DB_PASSWORD}@db:5432/climate_litigation
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      PYTHONPATH: /app/scripts:/app
    secrets:
      - gemini_api_key
    volumes:
      - ../docs/data:/app/docs/data
      - ../analysis_output:/app/analysis_output
    command: ["python", "scripts/export_static_site.py"]

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles:
      - pipeline
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://phdmutley:${DB_PASSWORD}@db:5432/climate_litigation
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      PYTHONPATH: /app/scripts:/app
    secrets:
      - gemini_api_key
    volumes:
      - ../pdfs:/app/pdfs
      - ../data:/app/data
      - ../logs:/app/logs
      - ../analysis_output:/app/analysis_output
    entrypoint: ["python"]

secrets:
  db_password:
    file: ./secrets/db_password.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt

volumes:
  pgdata:
