<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhD Climate Litigation — Project Report</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'], mono: ['Space Mono', 'monospace'] },
          colors: {
            surface: { 1: '#0a0f14', 2: '#111820', 3: '#1a222d', 4: '#242d3a' },
            border: { DEFAULT: '#2a3544', hover: '#3d4f66' },
            txt: { 1: '#e8edf3', 2: '#8b9aad', 3: '#5a6978' },
            north: '#3b82f6',
            south: '#10b981',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #0a0f14; }
    .mono { font-family: 'Space Mono', monospace; }
    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111820; }
    ::-webkit-scrollbar-thumb { background: #2a3544; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3d4f66; }
    /* accordion animation */
    .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease; opacity: 0; }
    .accordion-body.open { opacity: 1; }
    .accordion-chevron { transition: transform 0.3s ease; }
    .accordion-chevron.open { transform: rotate(180deg); }
    /* tab underline */
    .tab-active { border-bottom: 2px solid #3b82f6; color: #e8edf3; }
    .tab-inactive { border-bottom: 2px solid transparent; color: #5a6978; }
    .tab-inactive:hover { color: #8b9aad; }
    /* modal */
    .modal-backdrop { opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-panel { transform: scale(0.95) translateY(10px); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); }
    .modal-backdrop.active .modal-panel { transform: scale(1) translateY(0); }
    /* pipeline node */
    .pipeline-node { transition: all 0.2s ease; }
    .pipeline-node:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
    /* badge pulse */
    @keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
    /* progress bar animation */
    @keyframes progress-fill { from { width: 0; } }
    .progress-bar { animation: progress-fill 1.2s cubic-bezier(0.4,0,0.2,1); }
    /* card hover */
    .card-hover { transition: border-color 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { border-color: #3d4f66; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  </style>
</head>
<body class="text-txt-1 min-h-screen">

  <!-- App Shell -->
  <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Header -->
    <header class="mb-10">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-lg bg-north/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-north" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-txt-1">PhD Climate Litigation</h1>
          <p class="text-sm text-txt-3 mono">Citation Analysis Pipeline &mdash; Project Report</p>
        </div>
      </div>
      <p class="text-txt-2 text-sm mt-3 max-w-2xl">Doctoral research analyzing citation patterns between Global North and Global South courts in climate litigation decisions. Processing 2,924 judicial decisions from the Climate Case Chart database.</p>
    </header>

    <!-- Summary Cards -->
    <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10"></div>

    <!-- Navigation Tabs -->
    <nav class="flex gap-6 border-b border-border mb-8">
      <button onclick="switchTab('completed')" id="tab-completed" class="tab-active pb-3 text-sm font-medium cursor-pointer">Completed</button>
      <button onclick="switchTab('pending')" id="tab-pending" class="tab-inactive pb-3 text-sm font-medium cursor-pointer">Pending</button>
      <button onclick="switchTab('decisions')" id="tab-decisions" class="tab-inactive pb-3 text-sm font-medium cursor-pointer">Decisions</button>
      <button onclick="switchTab('pipeline')" id="tab-pipeline" class="tab-inactive pb-3 text-sm font-medium cursor-pointer">Pipeline</button>
    </nav>

    <!-- Tab Content -->
    <div id="tab-content"></div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" onclick="closeModal(event)">
    <div class="modal-panel bg-surface-3 rounded-xl border border-border max-w-2xl w-full mx-4 max-h-[85vh] overflow-hidden flex flex-col" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-border">
        <h3 id="modal-title" class="font-semibold text-txt-1"></h3>
        <button onclick="closeModal()" class="text-txt-3 hover:text-txt-1 cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body" class="px-6 py-4 overflow-y-auto text-sm text-txt-2 leading-relaxed"></div>
    </div>
  </div>

  <script>
  // ─── Data ──────────────────────────────────────────────────────────────
  let DATA = null;

  async function loadData() {
    const res = await fetch('data/report_data.json');
    DATA = await res.json();
    render();
  }

  // ─── Helpers ───────────────────────────────────────────────────────────
  const statusConfig = {
    completed:   { label: 'Completed',   color: 'bg-emerald-500/20 text-emerald-400', dot: 'bg-emerald-400', border: 'border-emerald-500/30' },
    in_progress: { label: 'In Progress', color: 'bg-blue-500/20 text-blue-400',      dot: 'bg-blue-400 pulse-dot', border: 'border-blue-500/30' },
    pending:     { label: 'Pending',     color: 'bg-amber-500/20 text-amber-400',    dot: 'bg-amber-400', border: 'border-amber-500/30' },
    blocked:     { label: 'Blocked',     color: 'bg-red-500/20 text-red-400',        dot: 'bg-red-400', border: 'border-red-500/30' },
    deferred:    { label: 'Deferred',    color: 'bg-gray-500/20 text-gray-400',      dot: 'bg-gray-400', border: 'border-gray-500/30' },
    implemented: { label: 'Implemented', color: 'bg-emerald-500/20 text-emerald-400', dot: 'bg-emerald-400', border: 'border-emerald-500/30' },
    active:      { label: 'Active',      color: 'bg-cyan-500/20 text-cyan-400',      dot: 'bg-cyan-400', border: 'border-cyan-500/30' },
  };

  const priorityConfig = {
    critical: { label: 'Critical', color: 'text-red-400 bg-red-500/10 border-red-500/20' },
    high:     { label: 'High',     color: 'text-orange-400 bg-orange-500/10 border-orange-500/20' },
    medium:   { label: 'Medium',   color: 'text-yellow-400 bg-yellow-500/10 border-yellow-500/20' },
    low:      { label: 'Low',      color: 'text-gray-400 bg-gray-500/10 border-gray-500/20' },
  };

  function badge(status) {
    const c = statusConfig[status] || statusConfig.pending;
    return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium ${c.color}"><span class="w-1.5 h-1.5 rounded-full ${c.dot}"></span>${c.label}</span>`;
  }

  function priorityBadge(p) {
    const c = priorityConfig[p] || priorityConfig.medium;
    return `<span class="inline-flex px-2 py-0.5 rounded text-xs font-medium border ${c.color}">${c.label}</span>`;
  }

  function formatDate(d) {
    if (!d) return '—';
    const dt = new Date(d);
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── Render Summary Cards ─────────────────────────────────────────────
  function renderSummary() {
    const s = DATA.summary;
    const bs = s.tasks_by_status;
    const totalPhases = DATA.phases.length;
    const completedPhases = DATA.phases.filter(p => p.status === 'completed').length;
    const phasePct = Math.round((completedPhases / totalPhases) * 100);
    const taskPct = Math.round(((bs.completed || 0) / s.total_tasks) * 100);

    const cards = [
      { label: 'Total Tasks', value: s.total_tasks, sub: `${bs.completed||0} completed`, icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2', accent: 'north' },
      { label: 'Task Progress', value: `${taskPct}%`, sub: `${bs.pending||0} pending`, icon: 'M13 10V3L4 14h7v7l9-11h-7', accent: 'emerald-400', bar: taskPct },
      { label: 'Phases', value: `${completedPhases}/${totalPhases}`, sub: `${phasePct}% complete`, icon: 'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10', accent: 'violet-400', bar: phasePct },
      { label: 'Decisions', value: DATA.decisions.length, sub: `${DATA.decisions.filter(d=>d.status==='implemented'||d.status==='active').length} active`, icon: 'M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z', accent: 'cyan-400' },
    ];

    document.getElementById('summary-cards').innerHTML = cards.map(c => `
      <div class="bg-surface-3 rounded-xl border border-border p-5 card-hover">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs text-txt-3 font-medium uppercase tracking-wider">${c.label}</span>
          <svg class="w-4 h-4 text-txt-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${c.icon}"/></svg>
        </div>
        <div class="text-2xl font-bold text-txt-1 mono">${c.value}</div>
        <div class="text-xs text-txt-3 mt-1">${c.sub}</div>
        ${c.bar !== undefined ? `<div class="mt-3 h-1.5 bg-surface-4 rounded-full overflow-hidden"><div class="progress-bar h-full bg-${c.accent} rounded-full" style="width:${c.bar}%"></div></div>` : ''}
      </div>
    `).join('');
  }

  // ─── Tab switching ─────────────────────────────────────────────────────
  let currentTab = 'completed';
  function switchTab(tab) {
    currentTab = tab;
    ['completed','pending','decisions','pipeline'].forEach(t => {
      const el = document.getElementById('tab-' + t);
      el.className = t === tab ? 'tab-active pb-3 text-sm font-medium cursor-pointer' : 'tab-inactive pb-3 text-sm font-medium cursor-pointer';
    });
    renderTab();
  }

  function renderTab() {
    const container = document.getElementById('tab-content');
    switch(currentTab) {
      case 'completed': container.innerHTML = renderPhaseGroups('completed'); break;
      case 'pending':   container.innerHTML = renderPhaseGroups('pending'); break;
      case 'decisions': container.innerHTML = renderDecisions(); break;
      case 'pipeline':  container.innerHTML = renderPipeline(); break;
    }
  }

  // ─── Phase Groups (Completed / Pending) ────────────────────────────────
  function renderPhaseGroups(mode) {
    const phases = DATA.phases.filter(p => {
      if (mode === 'completed') return p.status === 'completed';
      return p.status !== 'completed';
    });

    if (phases.length === 0) {
      return `<div class="text-center py-16 text-txt-3">No ${mode} phases.</div>`;
    }

    const taskFilter = mode === 'completed'
      ? t => t.status === 'completed'
      : t => t.status !== 'completed';

    return `
      <div class="space-y-3">
        ${phases.map((phase, idx) => {
          const tasks = (phase.tasks || []).filter(taskFilter);
          const allTasks = phase.tasks || [];
          const completedCount = allTasks.filter(t => t.status === 'completed').length;
          const totalCount = allTasks.length;
          const pct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : (phase.status === 'completed' ? 100 : 0);
          const sc = statusConfig[phase.status] || statusConfig.pending;

          return `
            <div class="bg-surface-2 rounded-xl border border-border card-hover overflow-hidden">
              <!-- Phase Header (Accordion Trigger) -->
              <button onclick="toggleAccordion('phase-${mode}-${idx}')" class="w-full flex items-center justify-between px-5 py-4 cursor-pointer text-left group">
                <div class="flex items-center gap-4 min-w-0">
                  <div class="flex-shrink-0 w-9 h-9 rounded-lg ${sc.color} flex items-center justify-center">
                    <span class="text-sm font-bold">${phase.id > 100 ? String.fromCharCode(64 + (phase.id - 100)) : phase.id}</span>
                  </div>
                  <div class="min-w-0">
                    <h3 class="text-sm font-semibold text-txt-1 truncate">${escHtml(phase.name)}</h3>
                    <p class="text-xs text-txt-3 truncate">${escHtml(phase.description || '')}</p>
                  </div>
                </div>
                <div class="flex items-center gap-4 flex-shrink-0 ml-4">
                  ${totalCount > 0 ? `
                    <div class="hidden sm:flex items-center gap-2">
                      <div class="w-24 h-1.5 bg-surface-4 rounded-full overflow-hidden">
                        <div class="h-full rounded-full ${phase.status === 'completed' ? 'bg-emerald-400' : 'bg-blue-400'}" style="width:${pct}%"></div>
                      </div>
                      <span class="text-xs text-txt-3 mono w-12 text-right">${completedCount}/${totalCount}</span>
                    </div>
                  ` : ''}
                  ${badge(phase.status)}
                  <svg id="chevron-phase-${mode}-${idx}" class="accordion-chevron w-4 h-4 text-txt-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
              </button>

              <!-- Phase Body (Accordion Content) -->
              <div id="phase-${mode}-${idx}" class="accordion-body">
                <div class="px-5 pb-4">
                  ${phase.start_date || phase.due_date || phase.completed_date ? `
                    <div class="flex gap-4 mb-3 text-xs text-txt-3">
                      ${phase.start_date ? `<span>Started: <span class="text-txt-2 mono">${formatDate(phase.start_date)}</span></span>` : ''}
                      ${phase.due_date ? `<span>Due: <span class="text-txt-2 mono">${formatDate(phase.due_date)}</span></span>` : ''}
                      ${phase.completed_date ? `<span>Completed: <span class="text-emerald-400 mono">${formatDate(phase.completed_date)}</span></span>` : ''}
                    </div>
                  ` : ''}

                  ${tasks.length > 0 ? `
                    <div class="space-y-2">
                      ${tasks.map(t => `
                        <div class="bg-surface-3 rounded-lg border border-border/50 px-4 py-3 flex items-start justify-between gap-3 cursor-pointer card-hover" onclick="openTaskModal(${t.id})">
                          <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2 mb-1">
                              <span class="text-xs text-txt-3 mono">#${t.id}</span>
                              ${priorityBadge(t.priority)}
                              ${badge(t.status)}
                            </div>
                            <h4 class="text-sm font-medium text-txt-1 leading-snug">${escHtml(t.subject)}</h4>
                            ${t.owner ? `<span class="text-xs text-txt-3 mt-1 inline-block">@${escHtml(t.owner)}</span>` : ''}
                          </div>
                          <div class="flex-shrink-0 text-txt-3 mt-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  ` : `<p class="text-xs text-txt-3 italic py-2">No individual tasks tracked for this phase.</p>`}
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // ─── Decisions ─────────────────────────────────────────────────────────
  function renderDecisions() {
    const decisions = DATA.decisions;
    return `
      <div class="space-y-4">
        <p class="text-sm text-txt-2 mb-4">${decisions.length} key decisions shaping the project's architecture and methodology.</p>
        <div class="grid gap-3 md:grid-cols-2">
          ${decisions.map(d => {
            const sc = statusConfig[d.status] || statusConfig.pending;
            return `
              <div class="bg-surface-2 rounded-xl border border-border p-5 card-hover cursor-pointer" onclick="openDecisionModal('${d.id}')">
                <div class="flex items-center justify-between mb-3">
                  <span class="mono text-xs font-bold text-north">${escHtml(d.id)}</span>
                  ${badge(d.status)}
                </div>
                <h4 class="text-sm font-semibold text-txt-1 mb-2">${escHtml(d.title)}</h4>
                <p class="text-xs text-txt-3 line-clamp-2">${escHtml(d.rationale || '')}</p>
                <div class="flex items-center gap-3 mt-3 text-xs text-txt-3">
                  ${d.source ? `<span class="flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>${escHtml(d.source)}</span>` : ''}
                  ${d.phase_id ? `<span>Phase ${d.phase_id}</span>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  // ─── Pipeline ──────────────────────────────────────────────────────────
  function renderPipeline() {
    // Build dependency graph for pending tasks
    const pendingPhases = DATA.phases.filter(p => p.status !== 'completed');
    const pendingTasks = [];
    pendingPhases.forEach(p => {
      (p.tasks || []).filter(t => t.status !== 'completed' && t.status !== 'deferred').forEach(t => {
        pendingTasks.push({ ...t, phaseName: p.name });
      });
    });

    // Build dep map
    const depMap = {};
    DATA.dependencies.forEach(d => {
      if (!depMap[d.task_id]) depMap[d.task_id] = [];
      depMap[d.task_id].push(d);
    });

    // Topological sort into layers
    const allTasks = [];
    DATA.phases.forEach(p => (p.tasks || []).forEach(t => allTasks.push(t)));
    const taskMap = {};
    allTasks.forEach(t => taskMap[t.id] = t);

    // Determine execution order layers
    const layers = [];
    const placed = new Set();
    const pendingIds = new Set(pendingTasks.map(t => t.id));

    // Layer 0: tasks with no unresolved dependencies
    let maxIter = 20;
    while (placed.size < pendingTasks.length && maxIter-- > 0) {
      const layer = [];
      pendingTasks.forEach(t => {
        if (placed.has(t.id)) return;
        const deps = (depMap[t.id] || []);
        const blocked = deps.some(d => pendingIds.has(d.depends_on) && !placed.has(d.depends_on));
        if (!blocked) layer.push(t);
      });
      if (layer.length === 0) {
        // remaining are circular or blocked — push them all
        pendingTasks.forEach(t => { if (!placed.has(t.id)) layer.push(t); });
      }
      layer.forEach(t => placed.add(t.id));
      layers.push(layer);
    }

    return `
      <div>
        <div class="mb-6">
          <h3 class="text-lg font-semibold text-txt-1 mb-1">Execution Pipeline</h3>
          <p class="text-sm text-txt-2">Ideal execution order based on task dependencies. Tasks in the same layer can run in parallel.</p>
        </div>

        <div class="relative">
          ${layers.map((layer, li) => `
            <!-- Layer ${li + 1} -->
            <div class="mb-6">
              <div class="flex items-center gap-3 mb-3">
                <div class="w-8 h-8 rounded-full bg-north/20 flex items-center justify-center">
                  <span class="text-xs font-bold text-north mono">${li + 1}</span>
                </div>
                <div class="flex-1 h-px bg-border"></div>
                <span class="text-xs text-txt-3 mono">${layer.length} task${layer.length > 1 ? 's' : ''}</span>
              </div>
              <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3 ml-11">
                ${layer.map(t => {
                  const deps = (depMap[t.id] || []);
                  const sc = statusConfig[t.status] || statusConfig.pending;
                  return `
                    <div class="pipeline-node bg-surface-3 rounded-xl border ${sc.border} p-4 cursor-pointer" onclick="openTaskModal(${t.id})">
                      <div class="flex items-center justify-between mb-2">
                        <span class="mono text-xs text-txt-3">#${t.id}</span>
                        <div class="flex items-center gap-2">
                          ${priorityBadge(t.priority)}
                          ${badge(t.status)}
                        </div>
                      </div>
                      <h4 class="text-sm font-medium text-txt-1 mb-2 leading-snug">${escHtml(t.subject)}</h4>
                      <div class="flex items-center justify-between text-xs text-txt-3">
                        <span>${escHtml(t.phaseName || '')}</span>
                        ${t.owner ? `<span>@${escHtml(t.owner)}</span>` : ''}
                      </div>
                      ${deps.length > 0 ? `
                        <div class="mt-2 pt-2 border-t border-border/50">
                          <span class="text-xs text-txt-3">Depends on:</span>
                          ${deps.map(d => `<span class="inline-flex ml-1 px-1.5 py-0.5 rounded bg-surface-4 text-xs text-txt-3 mono">#${d.depends_on}</span>`).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            ${li < layers.length - 1 ? `
              <div class="ml-4 flex items-center gap-2 mb-4 -mt-2">
                <div class="w-px h-6 bg-border ml-3.5"></div>
                <svg class="w-3 h-3 text-txt-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
              </div>
            ` : ''}
          `).join('')}
        </div>
      </div>
    `;
  }

  // ─── Accordion Toggle ─────────────────────────────────────────────────
  function toggleAccordion(id) {
    const body = document.getElementById(id);
    const chevron = document.getElementById('chevron-' + id);
    if (body.classList.contains('open')) {
      body.style.maxHeight = '0px';
      body.classList.remove('open');
      chevron.classList.remove('open');
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';
      body.classList.add('open');
      chevron.classList.add('open');
    }
  }

  // ─── Modal ─────────────────────────────────────────────────────────────
  function openTaskModal(taskId) {
    let task = null;
    let phaseName = '';
    DATA.phases.forEach(p => {
      (p.tasks || []).forEach(t => {
        if (t.id === taskId) { task = t; phaseName = p.name; }
      });
    });
    if (!task) return;

    const deps = DATA.dependencies.filter(d => d.task_id === taskId);
    const blocksOthers = DATA.dependencies.filter(d => d.depends_on === taskId);

    document.getElementById('modal-title').innerHTML = `
      <span class="mono text-txt-3 mr-2">#${task.id}</span> ${escHtml(task.subject)}
    `;

    let descHtml = '';
    if (task.description) {
      // Parse the structured description into sections
      const lines = task.description.split('\n');
      let currentSection = '';
      let sections = {};
      lines.forEach(line => {
        const sMatch = line.match(/^([A-Z][A-Z\s]+):/);
        if (sMatch) {
          currentSection = sMatch[1].trim();
          sections[currentSection] = (sections[currentSection] || '') + line.substring(sMatch[0].length).trim() + '\n';
        } else if (currentSection) {
          sections[currentSection] += line + '\n';
        } else {
          sections['_intro'] = (sections['_intro'] || '') + line + '\n';
        }
      });

      const sectionIcons = {
        'DESCRIPTION': 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
        'IMPACT': 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z',
        'EVIDENCE': 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z',
        'PROBABLE CAUSE': 'M10 21h7a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v11m0 5l4.879-4.879m0 0a3 3 0 104.243-4.242 3 3 0 00-4.243 4.242z',
        'SUGGESTED FIX': 'M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1 2 2 0 110-4 1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z',
      };

      Object.entries(sections).forEach(([key, val]) => {
        if (key === '_intro') {
          descHtml += `<p class="mb-4 text-txt-2">${escHtml(val.trim())}</p>`;
        } else {
          const icon = sectionIcons[key] || 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
          descHtml += `
            <div class="mb-4">
              <div class="flex items-center gap-2 mb-1.5">
                <svg class="w-4 h-4 text-north" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${icon}"/></svg>
                <h4 class="text-xs font-bold text-txt-1 uppercase tracking-wider">${escHtml(key)}</h4>
              </div>
              <div class="ml-6 text-txt-2 whitespace-pre-line text-sm leading-relaxed">${escHtml(val.trim())}</div>
            </div>
          `;
        }
      });
    }

    document.getElementById('modal-body').innerHTML = `
      <div class="space-y-4">
        <!-- Meta row -->
        <div class="flex flex-wrap gap-3 items-center">
          ${badge(task.status)}
          ${priorityBadge(task.priority)}
          ${task.owner ? `<span class="text-xs text-txt-3 border border-border rounded-full px-2.5 py-0.5">@${escHtml(task.owner)}</span>` : ''}
          <span class="text-xs text-txt-3 bg-surface-4 rounded-full px-2.5 py-0.5">${escHtml(phaseName)}</span>
        </div>

        <!-- Dates -->
        <div class="grid grid-cols-3 gap-2 text-xs">
          <div class="bg-surface-4 rounded-lg p-3">
            <span class="text-txt-3 block mb-0.5">Created</span>
            <span class="text-txt-2 mono">${formatDate(task.created_at)}</span>
          </div>
          <div class="bg-surface-4 rounded-lg p-3">
            <span class="text-txt-3 block mb-0.5">Due</span>
            <span class="text-txt-2 mono">${formatDate(task.due_date)}</span>
          </div>
          <div class="bg-surface-4 rounded-lg p-3">
            <span class="text-txt-3 block mb-0.5">Completed</span>
            <span class="${task.completed_date ? 'text-emerald-400' : 'text-txt-3'} mono">${formatDate(task.completed_date)}</span>
          </div>
        </div>

        <!-- Description -->
        ${descHtml ? `<div class="pt-2">${descHtml}</div>` : ''}

        <!-- Dependencies -->
        ${deps.length > 0 || blocksOthers.length > 0 ? `
          <div class="border-t border-border pt-4">
            <h4 class="text-xs font-bold text-txt-1 uppercase tracking-wider mb-2">Dependencies</h4>
            ${deps.length > 0 ? `
              <div class="mb-2">
                <span class="text-xs text-txt-3 mb-1 block">This task depends on:</span>
                ${deps.map(d => `
                  <div class="flex items-center gap-2 ml-2 my-1">
                    <svg class="w-3 h-3 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18"/></svg>
                    <span class="text-xs mono text-txt-3">#${d.depends_on}</span>
                    <span class="text-xs text-txt-2">${escHtml(d.depends_on_subject)}</span>
                    ${taskMap[d.depends_on]?.status === 'completed' ? badge('completed') : badge(taskMap[d.depends_on]?.status || 'pending')}
                  </div>
                `).join('')}
              </div>
            ` : ''}
            ${blocksOthers.length > 0 ? `
              <div>
                <span class="text-xs text-txt-3 mb-1 block">Blocks:</span>
                ${blocksOthers.map(d => `
                  <div class="flex items-center gap-2 ml-2 my-1">
                    <svg class="w-3 h-3 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                    <span class="text-xs mono text-txt-3">#${d.task_id}</span>
                    <span class="text-xs text-txt-2">${escHtml(d.task_subject)}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        ` : ''}
      </div>
    `;

    document.getElementById('modal').classList.add('active');
  }

  function openDecisionModal(decisionId) {
    const d = DATA.decisions.find(x => x.id === decisionId);
    if (!d) return;

    document.getElementById('modal-title').innerHTML = `
      <span class="mono text-north mr-2">${escHtml(d.id)}</span> ${escHtml(d.title)}
    `;

    document.getElementById('modal-body').innerHTML = `
      <div class="space-y-4">
        <div class="flex flex-wrap gap-3 items-center">
          ${badge(d.status)}
          ${d.phase_id ? `<span class="text-xs text-txt-3 bg-surface-4 rounded-full px-2.5 py-0.5">Phase ${d.phase_id}</span>` : ''}
          ${d.source ? `<span class="text-xs text-txt-3 bg-surface-4 rounded-full px-2.5 py-0.5">${escHtml(d.source)}</span>` : ''}
        </div>

        <div>
          <h4 class="text-xs font-bold text-txt-1 uppercase tracking-wider mb-2">Rationale</h4>
          <p class="text-sm text-txt-2 leading-relaxed">${escHtml(d.rationale || 'No rationale recorded.')}</p>
        </div>

        <div class="bg-surface-4 rounded-lg p-3 text-xs text-txt-3">
          <span>Recorded: <span class="text-txt-2 mono">${formatDate(d.created_at)}</span></span>
        </div>
      </div>
    `;

    document.getElementById('modal').classList.add('active');
  }

  function closeModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('modal').classList.remove('active');
  }

  // Close modal on Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // ─── Init ──────────────────────────────────────────────────────────────
  function render() {
    renderSummary();
    renderTab();
  }

  loadData();
  </script>
</body>
</html>
