ed_at":"2026-03-04 23:57:30","updated_at":"2026-03-07 21:38:56"},{"id":74,"phase_id":108,"subject":"Investigate snippet miss rate (35% on chunked docs)","description":"Trial run showed 39/60 snippets found (65% hit rate). Worst on chunked documents (e.g. 986K-char doc: 0/9 found). Root cause: LLM raw_text from chunk extraction does not match full document verbatim. Consider: normalized matching improvements in snippet_extractor.py, or extracting snippets per-chunk before deduplication. | Confirmed in debug session: snippet miss causes Phase 2B fallback (graceful degradation)","owner":"Gustavo","priority":"medium","status":"pending","due_date":"2026-03-08","completed_date":null,"created_at":"2026-03-05 23:02:50","updated_at":"2026-03-05 23:52:19"},{"id":94,"phase_id":108,"subject":"Review 259 extraction-failed documents","description":"Report at data/extraction_failed_docs.json (on VM). 91 zero-byte (download failures) + 168 unreadable PDFs (corrupt/no text layer). 1.6%% of corpus. Cross-reference with Sabin DB if Lucas flags missing decisions.","owner":"Lucas","priority":"low","status":"pending","due_date":null,"completed_date":null,"created_at":"2026-03-06 18:11:32","updated_at":"2026-03-06 18:11:32"},{"id":99,"phase_id":108,"subject":"Export extraction results to Excel with doc links for Lucas","description":"Excel format with direct document links for manual review. Similar to previous validation Excel.","owner":"Gustavo","priority":"critical","status":"pending","due_date":"2026-03-07","completed_date":null,"created_at":"2026-03-07 21:38:56","updated_at":"2026-03-07 21:38:56"},{"id":100,"phase_id":108,"subject":"Lucas manual review of Excel output with process annotations","description":"Review extraction results in Excel. Annotate review process (what is checked, data path) to enable future AI-automated review.","owner":"Lucas","priority":"critical","status":"pending","due_date":"2026-03-08","completed_date":null,"created_at":"2026-03-07 21:38:56","updated_at":"2026-03-07 21:38:56"},{"id":101,"phase_id":108,"subject":"Run DB queries for automated pre-review of citations","description":"Query citation data, inspect chunks, validate patterns. Complementary to Lucas manual review.","owner":"Gustavo","priority":"high","status":"pending","due_date":"2026-03-08","completed_date":null,"created_at":"2026-03-07 21:38:56","updated_at":"2026-03-07 21:38:56"},{"id":102,"phase_id":108,"subject":"Morning sync + work session at Lucas place","description":"Align manual + automated reviews. Work together until Adriano meeting (noon-1pm).","owner":"Both","priority":"critical","status":"pending","due_date":"2026-03-08","completed_date":null,"created_at":"2026-03-07 21:38:56","updated_at":"2026-03-07 21:38:56"}]},{"id":111,"name":"Bugs: Step E Extraction (VM Run)","description":"Issues identified during extract_citations.py --concurrent 10 on GCP VM","status":"in_progress","start_date":"2026-03-07","due_date":null,"completed_date":null,"sort_order":11,"tasks":[{"id":95,"phase_id":111,"subject":"BUG: NoneType object is not subscriptable in Phase 2A extraction","description":"DESCRIPTION:\nRecurring error during Phase 2A (citation extraction). The Gemini API occasionally returns None instead of expected JSON structure, and the code attempts to subscript it (e.g., response[\"candidates\"] or similar).\n\nIMPACT: 275 documents (8% of processed) failed extraction entirely — recorded as extraction_success=false in DB. These docs have zero citations extracted.\n\nEVIDENCE: 1,004 error log lines in step_e_concurrent.log. Pattern: \"Error in extraction: 'NoneType' object is not subscriptable\" followed by \"Phase 2A failed - skipping document\".\n\nPROBABLE CAUSE: Missing null check on Gemini API response before accessing nested fields. The google-genai SDK may return None for response.text when the model returns an empty response, safety-filtered content, or hits a transient error.\n\nSUGGESTED FIX:\n1. Add null guard in extraction code: check if response and response.text are not None before JSON parsing\n2. If None, retry once before marking as failed (may be transient API issue)\n3. Log the raw response object for diagnosis when None is encountered\n4. Consider adding to gemini_client.py shared helper for consistency","owner":"Gustavo","priority":"high","status":"pending","due_date":"2026-03-07","completed_date":null,"created_at":"2026-03-07 20:19:57","updated_at":"2026-03-07 20:19:57"},{"id":96,"phase_id":111,"subject":"BUG: High rate-limit retry volume (5,274 retries) with --concurrent 10","description":"DESCRIPTION:\n5,274 rate-limit retries logged during the extraction run with concurrency=10. While the exponential backoff handles this gracefully (2.9s-5.7s waits), the volume suggests the concurrency level exceeds the Gemini API quota sweet spot.\n\nIMPACT: Not a hard failure — retries succeed. But adds ~15,000+ seconds of cumulative wait time, slowing overall throughput. Some retries cascade (attempt 1 then attempt 2 on same request).\n\nEVIDENCE: grep -c \"Rate limited\" shows 5,274 occurrences. Retry waits range from 2.2s to 5.7s with exponential backoff.\n\nPROBABLE CAUSE: --concurrent 10 fires too many parallel Gemini API calls for the project quota. The Gemini API rate limit is likely ~5-8 RPM for Flash-Lite, and 10 concurrent workers exceed this consistently.\n\nSUGGESTED FIX:\n1. For retry runs, reduce concurrency: --concurrent 5 or --concurrent 7\n2. Add adaptive concurrency: if rate-limit count exceeds threshold in a window, dynamically reduce active workers\n3. Add a rate-limit counter to the progress/cost summary for visibility\n4. Consider token-bucket rate limiter in gemini_client.py instead of reactive retries","owner":"Gustavo","priority":"high","status":"pending","due_date":null,"completed_date":null,"created_at":"2026-03-07 20:19:57","updated_at":"2026-03-07 20:19:57"},{"id":97,"phase_id":111,"subject":"BUG: 275 failed documents need retry pass","description":"DESCRIPTION:\n275 documents have extraction_success=false in citation_extraction_phased_summary. These documents were skipped after Phase 2A errors and have no citation data.\n\nIMPACT: ~8% data gap in the final analysis. If these docs contain significant cross-references (especially Global South citations), the research findings could be biased.\n\nEVIDENCE: DB query: SELECT COUNT(*) FROM citation_extraction_phased_summary WHERE extraction_success = false; → 275\n\nPROBABLE CAUSE: Combination of Bug #95 (NoneType errors) and transient API failures during high-concurrency processing.\n\nSUGGESTED FIX:\n1. After main run completes, run a targeted retry: extract_citations.py with a filter for failed documents only (WHERE extraction_success = false)\n2. Use lower concurrency (--concurrent 3-5) to reduce rate-limit pressure\n3. Add --retry-failed flag to extract_citations.py that queries for failed summaries and reprocesses only those\n4. If still failing after retry, log document IDs for manual inspection — may be corrupted/empty PDFs","owner":"Gustavo","priority":"high","status":"pending","due_date":"2026-03-08","completed_date":null,"created_at":"2026-03-07 20:19:57","updated_at":"2026-03-07 20:19:57"},{"id":98,"phase_id":111,"subject":"BUG: document_type=decision returns 0 on VM database","description":"DESCRIPTION:\nQuery SELECT COUNT(*) FROM documents WHERE document_type = 'decision' returns 0 on the VM database, yet 4,502 documents are being processed by the extraction script.\n\nIMPACT: Low immediate impact (extraction uses a different filter), but indicates the document_type column was not populated during the VM database restore or the classification step used a different column/value.\n\nEVIDENCE: psql query returns 0 for document_type='decision', but the extraction script found 4,502 docs to process. The classify_by_title.py and classify_ambiguous_docs.py scripts may store classification in a different column or table.\n\nPROBABLE CAUSE: \n- Classification stored in a different column (e.g., doc_classification, is_decision) \n- Or the title-based classifier uses sabin_document_title keywords and stores results differently than the original document_type field\n- Or the DB dump was from before classification was run and the VM classification used a separate tracking mechanism\n\nSUGGESTED FIX:\n1. Check what column/table classify_by_title.py and classify_ambiguous_docs.py actually write to\n2. Verify the extraction script filter query — it may use a JOIN or different column\n3. If document_type is supposed to be populated, add a post-classification step to sync it\n4. Document the actual classification storage mechanism in CLAUDE.md","owner":"Gustavo","priority":"high","status":"pending","due_date":null,"completed_date":null,"created_at":"2026-03-07 20:19:57","updated_at":"2026-03-07 20:19:57"}]},{"id":110,"name":"Phase G: VM Pipeline Execution","description":"Execute classification pipeline (Steps A-C) on GCP VM with async parallelization","status":"in_progress","start_date":"2026-03-06","due_date":"2026-03-07","completed_date":null,"sort_order":12,"tasks":[{"id":87,"phase_id":110,"subject":"Step A: classify_by_title.py (title keyword classification)","description":"Rule-based classification of 16K docs by title keywords. Ran on VM, classified ~13K docs.","owner":"Gustavo","priority":"high","status":"completed","due_date":"2026-03-06","completed_date":"2026-03-06T14:47:16.052379","created_at":"2026-03-06 17:47:16","updated_at":"2026-03-06 17:47:16"},{"id":88,"phase_id":110,"subject":"Step B: classify_ambiguous_docs.py (LLM classification)","description":"LLM partial-text classification of ~6K ambiguous docs. Running async (25 concurrent) on VM.","owner":"Gustavo","priority":"critical","status":"completed","due_date":"2026-03-06","completed_date":"2026-03-06T16:22:39.604523","created_at":"2026-03-06 17:47:16","updated_at":"2026-03-06 19:22:39"},{"id":89,"phase_id":110,"subject":"Async refactor of classify_ambiguous_docs.py","description":"3-phas :56"},{"id":"D18","title":"Monday deliverable = factual findings only","rationale":"Focus on observable patterns: which jurisdictions use foreign climate decisions, which cases are paradigmatic. No thesis argumentation.","source":"Touchpoint 7 Mar","status":"active","phase_id":6,"created_at":"2026-03-07 21:38:56"},{"id":"D19","title":"Phase 8 absorbed into Phase 5 / Phase 110","rationale":"The VM full extraction run (Step E) IS the full pipeline run. Phase 8 as originally planned is redundant.","source":"Touchpoint 7 Mar","status":"implemented","phase_id":null,"created_at":"2026-03-07 21:38:56"},{"id":"D2","title":"Gemini as primary LLM","rationale":"Cheaper, matches benchmarks, Lucas has credits","source":"Meeting 3 Mar","status":"implemented","phase_id":null,"created_at":"2026-03-04 23:57:30"},{"id":"D20","title":"Phase 7 (Trial Run) confirmed complete","rationale":"Test run of 100 docs executed, reviewed by Lucas, adjustments implemented, re-tested before full run.","source":"Touchpoint 7 Mar","status":"implemented","phase_id":7,"created_at":"2026-03-07 21:38:56"},{"id":"D21","title":"Complementary review strategy","rationale":"Lucas: manual Excel review (domain/legal). Gustavo: automated DB queries + chunk inspection (technical). Aligned tomorrow.","source":"Touchpoint 7 Mar","status":"active","phase_id":null,"created_at":"2026-03-07 21:38:56"},{"id":"D22","title":"Count citations per document (1 invocation per doc)","rationale":"If a document cites a foreign decision 15 times textually, count as 1. The act of invoking, not number of textual references.","source":"Touchpoint 7 Mar","status":"active","phase_id":null,"created_at":"2026-03-07 21:39:14"},{"id":"D3","title":"Markdown text extraction","rationale":"Better optimized for LLM processing","source":"Meeting 3 Mar","status":"pending","phase_id":3,"created_at":"2026-03-04 23:57:30"},{"id":"D4","title":"Use Sabin Case/Document IDs","rationale":"Sabin DB already provides both IDs","source":"Meeting 3 Mar","stat ssion (15 Mar)","deadline":"2026-03-10","status":"pending","source":"Meeting 3 Mar"}],"summary":{"total_tasks":78,"tasks_by_status":{"completed":56,"deferred":2,"in_progress":1,"pending":19}}};

  function formatDate(d) {
    if (!d) return '—';
    const dt = new Date(d);

  function escHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // ─── Phase Groups (Completed / Pending) ────────────────────────────────

    const phases = DATA.phases.filter(p => {
      if (mode === 'completed') return p.status === 'completed';
      return p.status !== 'completed';
    });

    if (phases.length === 0) {
      return `<div class="text-center py-16 text-txt-3">No ${mode} phases.</div>`;
    }

    const taskFilter = mode === 'completed'
      ? t => t.status === 'completed'
      : t => t.status !== 'completed';

    return `
      <div class="space-y-3">
        ${phases.map((phase, idx) => {
          const tasks = (phase.tasks || []).filter(taskFilter);
          const allTasks = phase.tasks || [];
          const completedCount = allTasks.filter(t => t.status === 'completed').length;
          const totalCount = allTasks.length;
          const pct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : (phase.status === 'completed' ? 100 : 0);

          return `

                  <div class="flex-shrink-0 w-9 h-9 rounded-lg ${sc.color} flex items-center justify-center">

                  </div>

                    <h3 class="text-sm font-semibold text-txt-1 truncate">${escHtml(phase.name)}</h3>
                    <p class="text-xs text-txt-3 truncate">${escHtml(phase.description || '')}</p>
                  </div>
                </div>
                <div class="flex items-center gap-4 flex-shrink-0 ml-4">
                  ${totalCount > 0 ? `
                    <div class="hidden sm:flex items-center gap-2">
                      <div class="w-24 h-1.5 bg-surface-4 rounded-full overflow-hidden">
                        <div class="h-full rounded-full ${phase.status === 'completed' ? 'bg-emerald-400' : 'bg-blue-400'}" style="width:${pct}%"></div>
                      </div>
                      <span class="text-xs text-txt-3 mono w-12 text-right">${completedCount}/${totalCount}</span>

                  ${badge(phase.status)}
                  <svg id="chevron-phase-${mode}-${idx}" class="accordion-chevron w-4 h-4 text-txt-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>

              <!-- Phase Body (Accordion Content) -->
              <div id="phase-${mode}-${idx}" class="accordion-body">

                  ${phase.start_date || phase.due_date || phase.completed_date ? `

  // ─── Pipeline ──────────────────────────────────────────────────────────
  function renderPipeline() {
    // Build dependency graph for pending tasks
    const pendingPhases = DATA.phases.filter(p => p.status !== 'completed');
    const pendingTasks = [];
    pendingPhases.forEach(p => {
      (p.tasks || []).filter(t => t.status !== 'completed' && t.status !== 'deferred').forEach(t => {
        pendingTasks.push({ ...t, phaseName: p.name });
      });
    });

    // Build dep map
    const depMap = {};
    DATA.dependencies.forEach(d => {
      if (!depMap[d.task_id]) depMap[d.task_id] = [];
      depMap[d.task_id].push(d);
    });

    // Topological sort into layers
    const allTasks = [];
    DATA.phases.forEach(p => (p.tasks || []).forEach(t => allTasks.push(t)));
    const taskMap = {};
    allTasks.forEach(t => taskMap[t.id] = t);

    // Determine execution order layers
    const layers = [];
    const placed = new Set();
    const pendingIds = new Set(pendingTasks.map(t => t.id));

    // Layer 0: tasks with no unresolved dependencies
    let maxIter = 20;
    while (placed.size < pendingTasks.length && maxIter-- > 0) {
      const layer = [];
      pendingTasks.forEach(t => {
        if (placed.has(t.id)) return;
        const deps = (depMap[t.id] || []);
        const blocked = deps.some(d => pendingIds.has(d.depends_on) && !placed.has(d.depends_on));
        if (!blocked) layer.push(t);
      });
      if (layer.length === 0) {
        // remaining are circular or blocked — push them all
        pendingTasks.forEach(t => { if (!placed.has(t.id)) layer.push(t); });
      }
      layer.forEach(t => placed.add(t.id));
      layers.push(layer);
    }

    return `
      <div>
        <div class="mb-6">
          <h3 class="text-lg font-semibold text-txt-1 mb-1">Execution Pipeline</h3>
          <p class="text-sm text-txt-2">Ideal execution order based on task dependencies. Tasks in the same layer can run in parallel.</p>
        </div>

        <div class="relative">
          ${layers.map((layer, li) => `
            <!-- Layer ${li + 1} -->
            <div class="mb-6">
              <div class="flex items-center gap-3 mb-3">
                <div class="w-8 h-8 rounded-full bg-north/20 flex items-center justify-center">
                  <span class="text-xs font-bold text-north mono">${li + 1}</span>
                </div>
                <div class="flex-1 h-px bg-border"></div>
                <span class="text-xs text-txt-3 mono">${layer.length} task${layer.length > 1 ? 's' : ''}</span>
              </div>
              <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3 ml-11">
                ${layer.map(t => {
                  const deps = (depMap[t.id] || []);
                  const sc = statusConfig[t.status] || statusConfig.pending;
                  return `
                    <div class="pipeline-node bg-surface-3 rounded-xl border ${sc.border} p-4 cursor-pointer" onclick="openTaskModal(${t.id})">
                      <div class="flex items-center justify-between mb-2">
                        <span class="mono text-xs text-txt-3">#${t.id}</span>
                        <div class="flex items-center gap-2">
                          ${priorityBadge(t.priority)}
                          ${badge(t.status)}
                        </div>
                      </div>
                      <h4 class="text-sm font-medium text-txt-1 mb-2 leading-snug">${escHtml(t.subject)}</h4>
                      <div class="flex items-center justify-between text-xs text-txt-3">
                        <span>${escHtml(t.phaseName || '')}</span>
                        ${t.owner ? `<span>@${escHtml(t.owner)}</span>` : ''}
                      </div>
                      ${deps.length > 0 ? `
                        <div class="mt-2 pt-2 border-t border-border/50">
                          <span class="text-xs text-txt-3">Depends on:</span>
                          ${deps.map(d => `<span class="inline-flex ml-1 px-1.5 py-0.5 rounded bg-surface-4 text-xs text-txt-3 mono">#${d.depends_on}</span>`).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            ${li < layers.length - 1 ? `
              <div class="ml-4 flex items-center gap-2 mb-4 -mt-2">
                <div class="w-px h-6 bg-border ml-3.5"></div>
                <svg class="w-3 h-3 text-txt-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
              </div>
            ` : ''}
          `).join('')}
        </div>
      </div>
    `;
  }

  // ─── Accordion Toggle ─────────────────────────────────────────────────
  function toggleAccordion(id) {
    const body = document.getElementById(id);
    const chevron = document.getElementById('chevron-' + id);
    if (body.classList.contains('open')) {
      body.style.maxHeight = '0px';
      body.classList.remove('open');
      chevron.classList.remove('open');
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';
      body.classList.add('open');
      chevron.classList.add('open');
    }
  }

  // ─── Modal ─────────────────────────────────────────────────────────────
  function openTaskModal(taskId) {
    let task = null;
    let phaseName = '';
    DATA.phases.forEach(p => {
      (p.tasks || []).forEach(t => {
        if (t.id === taskId) { task = t; phaseName = p.name; }
      });
    });
    if (!task) return;

    const deps = DATA.dependencies.filter(d => d.task_id === taskId);
    const blocksOthers = DATA.dependencies.filter(d => d.depends_on === taskId);

    document.getElementById('modal-title').innerHTML = `
      <span class="mono text-txt-3 mr-2">#${task.id}</span> ${escHtml(task.subject)}
    `;

    let descHtml = '';
    if (task.description) {
      // Parse the structured description into sections
      const lines = task.description.split('\n');
      let currentSection = '';
      let sections = {};
      lines.forEach(line => {
        const sMatch = line.match(/^([A-Z][A-Z\s]+):/);
        if (sMatch) {
          currentSection = sMatch[1].trim();
          sections[currentSection] = (sections[currentSection] || '') + line.substring(sMatch[0].length).trim() + '\n';
        } else if (currentSection) {
          sections[currentSection] += line + '\n';
        } else {
          sections['_intro'] = (sections['_intro'] || '') + line + '\n';
        }
      });

      const sectionIcons = {
        'DESCRIPTION': 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
        'IMPACT': 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z',
        'EVIDENCE': 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z',
        'PROBABLE CAUSE': 'M10 21h7a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v11m0 5l4.879-4.879m0 0a3 3 0 104.243-4.242 3 3 0 00-4.243 4.242z',
        'SUGGESTED FIX': 'M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1 2 2 0 110-4 1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z',
      };

      Object.entries(sections).forEach(([key, val]) => {
        if (key === '_intro') {
          descHtml += `<p class="mb-4 text-txt-2">${escHtml(val.trim())}</p>`;
        } else {
          const icon = sectionIcons[key] || 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
          descHtml += `
            <div class="mb-4">
              <div class="flex items-center gap-2 mb-1.5">
                <svg class="w-4 h-4 text-north" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${icon}"/></svg>
                <h4 class="text-xs font-bold text-txt-1 uppercase tracking-wider">${escHtml(key)}</h4>
              </div>
              <div class="ml-6 text-txt-2 whitespace-pre-line text-sm leading-relaxed">${escHtml(val.trim())}</div>
            </div>
          `;
        }
      });
    }

    document.getElementById('modal-body').innerHTML = `
      <div class="space-y-4">
        <!-- Meta row -->
        <div class="flex flex-wrap gap-3 items-center">
          ${badge(task.status)}
          ${priorityBadge(task.priority)}
          ${task.owner ? `<span class="text-xs text-txt-3 border border-border rounded-full px-2.5 py-0.5">@${escHtml(task.owner)}</span>` : ''}
          <span class="text-xs text-txt-3 bg-surface-4 rounded-full px-2.5 py-0.5">${escHtml(phaseName)}</span>
        </div>

        <!-- Dates -->
        <div class="grid grid-cols-3 gap-2 text-xs">
          <div class="bg-surface-4 rounded-lg p-3">
            <span class="text-txt-3 block mb-0.5">Created</span>
            <span class="text-txt-2 mono">${formatDate(task.created_at)}</span>
          </div>
          <div class="bg-surface-4 rounded-lg p-3">
            <span class="text-txt-3 block mb-0.5">Due</span>
            <span class="text-txt-2 mono">${formatDate(task.due_date)}</span>
          </div>
          <div class="bg-surface-4 rounded-lg p-3">
            <span class="text-txt-3 block mb-0.5">Completed</span>
            <span class="${task.completed_date ? 'text-emerald-400' : 'text-txt-3'} mono">${formatDate(task.completed_date)}</span>
          </div>
        </div>

        <!-- Description -->
        ${descHtml ? `<div class="pt-2">${descHtml}</div>` : ''}

        <!-- Dependencies -->
        ${deps.length > 0 || blocksOthers.length > 0 ? `
          <div class="border-t border-border pt-4">
            <h4 class="text-xs font-bold text-txt-1 uppercase tracking-wider mb-2">Dependencies</h4>
            ${deps.length > 0 ? `
              <div class="mb-2">
                <span class="text-xs text-txt-3 mb-1 block">This task depends on:</span>
                ${deps.map(d => `
                  <div class="flex items-center gap-2 ml-2 my-1">
                    <svg class="w-3 h-3 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18"/></svg>
                    <span class="text-xs mono text-txt-3">#${d.depends_on}</span>
                    <span class="text-xs text-txt-2">${escHtml(d.depends_on_subject)}</span>
                    ${taskMap[d.depends_on]?.status === 'completed' ? badge('completed') : badge(taskMap[d.depends_on]?.status || 'pending')}
                  </div>
                `).join('')}
              </div>
            ` : ''}
            ${blocksOthers.length > 0 ? `
              <div>
                <span class="text-xs text-txt-3 mb-1 block">Blocks:</span>
                ${blocksOthers.map(d => `
                  <div class="flex items-center gap-2 ml-2 my-1">
                    <svg class="w-3 h-3 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                    <span class="text-xs mono text-txt-3">#${d.task_id}</span>
                    <span class="text-xs text-txt-2">${escHtml(d.task_subject)}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        ` : ''}
      </div>
    `;

    document.getElementById('modal').classList.add('active');
  }

  function openDecisionModal(decisionId) {
    const d = DATA.decisions.find(x => x.id === decisionId);
    if (!d) return;

    document.getElementById('modal-title').innerHTML = `
      <span class="mono text-north mr-2">${escHtml(d.id)}</span> ${escHtml(d.title)}
    `;

    document.getElementById('modal-body').innerHTML = `
      <div class="space-y-4">
        <div class="flex flex-wrap gap-3 items-center">
          ${badge(d.status)}
          ${d.phase_id ? `<span class="text-xs text-txt-3 bg-surface-4 rounded-full px-2.5 py-0.5">Phase ${d.phase_id}</span>` : ''}
          ${d.source ? `<span class="text-xs text-txt-3 bg-surface-4 rounded-full px-2.5 py-0.5">${escHtml(d.source)}</span>` : ''}
        </div>

        <div>
          <h4 class="text-xs font-bold text-txt-1 uppercase tracking-wider mb-2">Rationale</h4>
          <p class="text-sm text-txt-2 leading-relaxed">${escHtml(d.rationale || 'No rationale recorded.')}</p>
        </div>

        <div class="bg-surface-4 rounded-lg p-3 text-xs text-txt-3">
          <span>Recorded: <span class="text-txt-2 mono">${formatDate(d.created_at)}</span></span>
        </div>
      </div>
    `;

    document.getElementById('modal').classList.add('active');
  }

  function closeModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('modal').classList.remove('active');
  }

  // Close modal on Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // ─── Init ──────────────────────────────────────────────────────────────
  function render() {
    renderSummary();
    renderTab();
  }

  loadData();
  </script>
</body>
</html>
