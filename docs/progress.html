<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>phdMutley — Progress Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
<style>
/* ================================================================
   CSS CUSTOM PROPERTIES — Dark Theme (matches main dashboard)
   ================================================================ */
:root {
    --bg-primary: #0a0f14;
    --bg-secondary: #111820;
    --bg-panel: #1a222d;
    --bg-hover: #242d3a;
    --bg-task: #151c25;
    --text-primary: #e8edf3;
    --text-secondary: #8b9aad;
    --text-muted: #5a6978;
    --north-primary: #3b82f6;
    --south-primary: #10b981;
    --accent-orange: #f97316;
    --accent-purple: #8b5cf6;
    --accent-red: #ef4444;
    --accent-yellow: #eab308;
    --accent-cyan: #06b6d4;
    --border-color: #2a3544;
    --border-hover: #3d4f66;
    --green: #10b981;
    --yellow: #eab308;
    --red: #ef4444;
    --orange: #f97316;
    --purple: #8b5cf6;
    --blue: #3b82f6;
    --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'Space Mono', monospace;
    --radius: 10px;
    --radius-sm: 6px;
    --gap: 16px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ================================================================
   RESET & BASE
   ================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ================================================================
   LAYOUT
   ================================================================ */
.app { max-width: 1280px; margin: 0 auto; padding: 24px 20px; }

header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
}
header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
}
header h1 span { color: var(--blue); }
.header-sub {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
}

/* Deadline banner */
.deadline-strip {
    display: flex;
    align-items: center;
    gap: 24px;
    background: linear-gradient(135deg, var(--bg-panel), #1e293b);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 14px 24px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}
.deadline-strip .dl-item { display: flex; gap: 8px; align-items: baseline; }
.deadline-strip .dl-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.deadline-strip .dl-value { font-weight: 700; font-size: 0.95rem; }
.deadline-strip .dl-countdown { margin-left: auto; font-family: var(--font-mono); font-weight: 700; font-size: 1.05rem; }
.dl-urgent { color: var(--red); }
.dl-normal { color: var(--yellow); }

/* ================================================================
   TABS
   ================================================================ */
.tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
}
.tab {
    padding: 10px 20px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 600;
    border-bottom: 2px solid transparent;
    transition: all var(--transition);
    white-space: nowrap;
    user-select: none;
}
.tab:hover { color: var(--text-secondary); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-content { display: none; animation: fadeIn 0.3s ease; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ================================================================
   DASHBOARD TAB — KPIs, Progress, Timeline
   ================================================================ */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: var(--gap);
    margin-bottom: 24px;
}
.kpi-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    transition: border-color var(--transition);
}
.kpi-card:hover { border-color: var(--border-hover); }
.kpi-number { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
.kpi-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }

/* Progress bar */
.progress-section { margin-bottom: 28px; }
.progress-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
}
.progress-title { font-weight: 600; font-size: 0.9rem; }
.progress-pct { font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-secondary); }
.progress-bar-track {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    height: 18px;
    overflow: hidden;
    display: flex;
}
.progress-segment {
    height: 100%;
    transition: width 0.6s ease;
    position: relative;
}
.seg-completed { background: linear-gradient(90deg, #059669, var(--green)); }
.seg-in-progress { background: linear-gradient(90deg, #ca8a04, var(--yellow)); }
.seg-pending { background: var(--bg-hover); }
.seg-deferred { background: var(--purple); opacity: 0.5; }
.progress-legend {
    display: flex;
    gap: 20px;
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--text-muted);
}
.legend-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
}

/* Charts row */
.charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
    margin-bottom: 28px;
}
.chart-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px;
}
.chart-card h3 {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text-secondary);
}
.chart-card canvas { max-height: 220px; }

/* Timeline */
.timeline-section { margin-bottom: 24px; }
.timeline-section h2 {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.timeline-section h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 20px;
    background: var(--blue);
    border-radius: 2px;
}
.timeline {
    position: relative;
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 0;
}
.timeline-day {
    display: contents;
}
.timeline-date {
    padding: 16px 16px 16px 0;
    border-right: 2px solid var(--border-color);
    position: relative;
    text-align: right;
}
.timeline-date-label {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-secondary);
}
.timeline-date-weekday {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
}
.timeline-date::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 20px;
    width: 10px;
    height: 10px;
    background: var(--bg-primary);
    border: 2px solid var(--blue);
    border-radius: 50%;
}
.timeline-date.today::after { background: var(--blue); }
.timeline-tasks {
    padding: 12px 0 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.tl-task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    transition: all var(--transition);
    cursor: default;
}
.tl-task:hover { border-color: var(--border-hover); background: var(--bg-hover); }
.tl-task-id { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); min-width: 32px; }
.tl-task-subject { flex: 1; }
.tl-task-owner { font-size: 0.75rem; color: var(--text-muted); }

/* ================================================================
   PHASES & TASKS TAB — Multi-level cascading
   ================================================================ */
.section-header {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 20px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-color);
}

.phase-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color var(--transition);
}
.phase-card:hover { border-color: var(--border-hover); }
.phase-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    transition: background var(--transition);
}
.phase-header:hover { background: var(--bg-hover); }
.phase-chevron {
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    transition: transform var(--transition);
    flex-shrink: 0;
}
.phase-card.open .phase-chevron { transform: rotate(90deg); }
.phase-title { flex: 1; font-weight: 600; font-size: 0.9rem; }
.phase-counter {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    background: var(--bg-primary);
    padding: 2px 8px;
    border-radius: 10px;
}
.phase-due { font-size: 0.8rem; color: var(--text-muted); }

.phase-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.3s ease;
}
.phase-card.open .phase-body { max-height: 2000px; }
.phase-desc {
    padding: 0 18px;
    font-size: 0.82rem;
    color: var(--text-secondary);
    margin-bottom: 10px;
    line-height: 1.5;
}
.phase-card.open .phase-desc { padding-top: 4px; }

.task-list { padding: 0 18px 14px; }
.task-row {
    display: grid;
    grid-template-columns: 36px auto 1fr auto auto auto;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    transition: background var(--transition);
    cursor: pointer;
}
.task-row:hover { background: var(--bg-hover); }
.task-row + .task-row { border-top: 1px solid rgba(42, 53, 68, 0.4); }
.task-id { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
.task-subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-owner { font-size: 0.75rem; color: var(--text-muted); }
.task-due { font-size: 0.75rem; color: var(--text-muted); min-width: 72px; text-align: right; }
.task-due.overdue { color: var(--red); font-weight: 600; }

/* Task detail expand */
.task-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    padding: 0 12px;
}
.task-detail.open { max-height: 300px; padding: 10px 12px; }
.task-detail-inner {
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 0.82rem;
    color: var(--text-secondary);
    line-height: 1.6;
}
.task-detail-inner .td-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
}
.task-detail-inner .td-row { margin-bottom: 8px; }
.task-detail-inner .td-row:last-child { margin-bottom: 0; }

/* ================================================================
   BADGES
   ================================================================ */
.badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
}
.badge-completed { background: rgba(16,185,129,0.12); color: var(--green); }
.badge-in_progress { background: rgba(234,179,8,0.12); color: var(--yellow); }
.badge-pending { background: rgba(90,105,120,0.15); color: var(--text-muted); }
.badge-blocked { background: rgba(239,68,68,0.12); color: var(--red); }
.badge-deferred { background: rgba(139,92,246,0.12); color: var(--purple); }
.badge-active { background: rgba(59,130,246,0.12); color: var(--blue); }
.badge-implemented { background: rgba(16,185,129,0.12); color: var(--green); }

/* Priority indicators */
.pri { font-weight: 700; font-size: 0.7rem; min-width: 14px; text-align: center; }
.pri-critical { color: var(--red); }
.pri-high { color: var(--orange); }
.pri-medium { color: var(--text-muted); }
.pri-low { color: var(--text-muted); opacity: 0.5; }

/* ================================================================
   DECISIONS TAB
   ================================================================ */
.decision-card {
    display: grid;
    grid-template-columns: 40px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    cursor: pointer;
    transition: all var(--transition);
}
.decision-card:hover { border-color: var(--border-hover); background: var(--bg-hover); }
.decision-id { font-family: var(--font-mono); font-weight: 700; color: var(--blue); font-size: 0.85rem; }
.decision-title { font-size: 0.88rem; font-weight: 500; }
.decision-source { font-size: 0.75rem; color: var(--text-muted); }
.decision-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
}
.decision-detail.open { max-height: 200px; }
.decision-rationale {
    padding: 10px 16px 14px 52px;
    font-size: 0.82rem;
    color: var(--text-secondary);
    line-height: 1.6;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-top: none;
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    margin-top: -6px;
    margin-bottom: 6px;
}

/* ================================================================
   ACTION ITEMS TAB
   ================================================================ */
.action-card {
    display: grid;
    grid-template-columns: 32px auto 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    font-size: 0.88rem;
    transition: border-color var(--transition);
}
.action-card:hover { border-color: var(--border-hover); }
.action-id { font-family: var(--font-mono); font-weight: 700; color: var(--purple); font-size: 0.85rem; }
.action-desc { color: var(--text-primary); }
.action-owner { font-size: 0.75rem; color: var(--text-muted); }
.action-deadline { font-size: 0.75rem; color: var(--text-muted); min-width: 72px; text-align: right; }

/* ================================================================
   DEPENDENCIES TAB
   ================================================================ */
.dep-card {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    font-size: 0.82rem;
    color: var(--text-secondary);
    border-bottom: 1px solid rgba(42,53,68,0.3);
}
.dep-card:last-child { border-bottom: none; }
.dep-arrow { color: var(--red); font-family: var(--font-mono); font-size: 0.75rem; white-space: nowrap; }
.dep-task { font-family: var(--font-mono); color: var(--text-muted); font-size: 0.75rem; }

/* ================================================================
   FOOTER
   ================================================================ */
footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.7rem;
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border-color);
}
footer code { font-family: var(--font-mono); color: var(--text-secondary); }

/* ================================================================
   RESPONSIVE
   ================================================================ */
@media (max-width: 768px) {
    .charts-row { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    .task-row { grid-template-columns: 36px auto 1fr auto; }
    .task-owner, .task-due { display: none; }
    .timeline { grid-template-columns: 80px 1fr; }
    .decision-card { grid-template-columns: 40px 1fr auto; }
    .decision-source { display: none; }
}
</style>
</head>
<body>

<div class="app">
    <header>
        <div>
            <h1>phd<span>Mutley</span> Progress</h1>
            <div class="header-sub">PIPELINE v2.0 &mdash; TRANSNATIONAL JUDICIAL CITATION ANALYSIS</div>
        </div>
        <div id="countdown" class="deadline-strip" style="margin-bottom:0; padding:10px 16px;">
        </div>
    </header>

    <div class="deadline-strip" id="deadline-banner"></div>

    <div class="tabs">
        <div class="tab active" data-tab="dashboard">Dashboard</div>
        <div class="tab" data-tab="phases">Phases &amp; Tasks</div>
        <div class="tab" data-tab="decisions">Decisions</div>
        <div class="tab" data-tab="actions">Action Items</div>
        <div class="tab" data-tab="deps">Dependencies</div>
    </div>

    <!-- ====== DASHBOARD TAB ====== -->
    <div class="tab-content active" id="tab-dashboard">
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="progress-section" id="progress-section"></div>
        <div class="charts-row">
            <div class="chart-card">
                <h3>Tasks by Status</h3>
                <canvas id="chart-status"></canvas>
            </div>
            <div class="chart-card">
                <h3>Tasks by Owner</h3>
                <canvas id="chart-owner"></canvas>
            </div>
        </div>
        <div class="timeline-section" id="timeline-section">
            <h2>Sprint Timeline &mdash; Today to Monday</h2>
            <div class="timeline" id="timeline"></div>
        </div>
    </div>

    <!-- ====== PHASES & TASKS TAB ====== -->
    <div class="tab-content" id="tab-phases"></div>

    <!-- ====== DECISIONS TAB ====== -->
    <div class="tab-content" id="tab-decisions"></div>

    <!-- ====== ACTION ITEMS TAB ====== -->
    <div class="tab-content" id="tab-actions"></div>

    <!-- ====== DEPENDENCIES TAB ====== -->
    <div class="tab-content" id="tab-deps"></div>

    <footer>
        <div>Generated from <code>progress.db</code> &middot; Export via <code>scripts/progress_tracker.py export</code></div>
        <div id="export-time"></div>
    </footer>
</div>

<script>
/* ================================================================
   DATA & STATE
   ================================================================ */
let DATA = null;
const TODAY = new Date().toISOString().slice(0, 10);
const DEADLINE = '2026-03-09';
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ================================================================
   INIT
   ================================================================ */
async function init() {
    const resp = await fetch('data/progress.json');
    DATA = await resp.json();
    renderDeadline();
    renderKPIs();
    renderProgress();
    renderCharts();
    renderTimeline();
    renderPhases();
    renderDecisions();
    renderActions();
    renderDeps();
    document.getElementById('export-time').textContent = 'Last export: ' + (DATA.summary.exported_at || 'unknown');
}

/* ================================================================
   TABS
   ================================================================ */
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
});

/* ================================================================
   HELPERS
   ================================================================ */
function esc(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function fmtDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    return d.getDate() + ' ' + MONTHS[d.getMonth()];
}

function isOverdue(dateStr, status) {
    return dateStr && dateStr < TODAY && status !== 'completed' && status !== 'deferred';
}

function priIcon(p) {
    if (p === 'critical') return '<span class="pri pri-critical">!!</span>';
    if (p === 'high') return '<span class="pri pri-high">!</span>';
    return '<span class="pri pri-medium"></span>';
}

function badgeHtml(status) {
    return '<span class="badge badge-' + status + '">' + status.replace('_', ' ') + '</span>';
}

function countTasks(tasks, status) {
    return tasks.filter(t => t.status === status).length;
}

/* ================================================================
   DEADLINE BANNER
   ================================================================ */
function renderDeadline() {
    const deadline = new Date(DEADLINE + 'T23:59:59');
    const now = new Date();
    const diff = deadline - now;
    const days = Math.floor(diff / 864e5);
    const hours = Math.floor((diff % 864e5) / 36e5);

    const el = document.getElementById('deadline-banner');
    let countdownHtml;
    if (diff < 0) {
        countdownHtml = '<span class="dl-countdown dl-urgent">DEADLINE PASSED</span>';
    } else {
        const cls = days <= 1 ? 'dl-urgent' : 'dl-normal';
        countdownHtml = '<span class="dl-countdown ' + cls + '">' + days + 'd ' + hours + 'h remaining</span>';
    }

    el.innerHTML =
        '<div class="dl-item"><span class="dl-label">Deliverable</span><span class="dl-value">9 Mar 2026</span></div>' +
        '<div class="dl-item"><span class="dl-label">Article</span><span class="dl-value">15 Mar 2026</span></div>' +
        countdownHtml;

    // Hide the header countdown dupe
    document.getElementById('countdown').style.display = 'none';
}

/* ================================================================
   KPIs
   ================================================================ */
function renderKPIs() {
    const s = DATA.summary;
    const ts = s.tasks_by_status;
    const ps = s.phases_by_status;
    const completedPct = s.total_tasks > 0 ? Math.round(((ts.completed || 0) / s.total_tasks) * 100) : 0;

    const cards = [
        { n: completedPct + '%', label: 'Overall', color: 'var(--green)' },
        { n: ps.completed || 0, label: 'Phases Done', color: 'var(--green)' },
        { n: (ps.in_progress || 0) + (ps.pending || 0), label: 'Phases Left', color: 'var(--yellow)' },
        { n: ts.completed || 0, label: 'Tasks Done', color: 'var(--green)' },
        { n: ts.in_progress || 0, label: 'In Progress', color: 'var(--yellow)' },
        { n: (ts.pending || 0) + (ts.blocked || 0), label: 'Remaining', color: 'var(--text-muted)' },
    ];

    document.getElementById('kpi-grid').innerHTML = cards.map(c =>
        '<div class="kpi-card"><div class="kpi-number" style="color:' + c.color + '">' + c.n + '</div><div class="kpi-label">' + c.label + '</div></div>'
    ).join('');
}

/* ================================================================
   PROGRESS BAR
   ================================================================ */
function renderProgress() {
    const ts = DATA.summary.tasks_by_status;
    const total = DATA.summary.total_tasks;
    const completed = ts.completed || 0;
    const inProgress = ts.in_progress || 0;
    const deferred = ts.deferred || 0;
    const pending = total - completed - inProgress - deferred;
    const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

    const pctW = (n) => (n / total * 100).toFixed(1) + '%';

    document.getElementById('progress-section').innerHTML =
        '<div class="progress-header">' +
            '<span class="progress-title">Task Completion</span>' +
            '<span class="progress-pct">' + completed + ' / ' + total + ' (' + pct + '%)</span>' +
        '</div>' +
        '<div class="progress-bar-track">' +
            '<div class="progress-segment seg-completed" style="width:' + pctW(completed) + '" title="Completed: ' + completed + '"></div>' +
            '<div class="progress-segment seg-in-progress" style="width:' + pctW(inProgress) + '" title="In Progress: ' + inProgress + '"></div>' +
            '<div class="progress-segment seg-deferred" style="width:' + pctW(deferred) + '" title="Deferred: ' + deferred + '"></div>' +
            '<div class="progress-segment seg-pending" style="width:' + pctW(pending) + '" title="Pending: ' + pending + '"></div>' +
        '</div>' +
        '<div class="progress-legend">' +
            '<span><span class="legend-dot" style="background:var(--green)"></span>Completed ' + completed + '</span>' +
            '<span><span class="legend-dot" style="background:var(--yellow)"></span>In Progress ' + inProgress + '</span>' +
            '<span><span class="legend-dot" style="background:var(--purple);opacity:0.5"></span>Deferred ' + deferred + '</span>' +
            '<span><span class="legend-dot" style="background:var(--bg-hover)"></span>Pending ' + pending + '</span>' +
        '</div>';
}

/* ================================================================
   CHARTS
   ================================================================ */
function renderCharts() {
    const ts = DATA.summary.tasks_by_status;
    Chart.defaults.color = '#8b9aad';
    Chart.defaults.borderColor = 'rgba(42,53,68,0.5)';

    // Status doughnut
    new Chart(document.getElementById('chart-status'), {
        type: 'doughnut',
        data: {
            labels: ['Completed', 'In Progress', 'Pending', 'Deferred', 'Blocked'],
            datasets: [{
                data: [ts.completed||0, ts.in_progress||0, ts.pending||0, ts.deferred||0, ts.blocked||0],
                backgroundColor: ['#10b981cc', '#eab308cc', '#5a6978cc', '#8b5cf6aa', '#ef4444cc'],
                borderColor: '#0a0f14',
                borderWidth: 2,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
                legend: { position: 'bottom', labels: { usePointStyle: true, padding: 14, font: { size: 11 } } }
            }
        }
    });

    // Owner bar chart
    const allTasks = DATA.phases.flatMap(p => p.tasks || []);
    const ownerCounts = {};
    allTasks.forEach(t => {
        const o = t.owner || 'Unassigned';
        if (!ownerCounts[o]) ownerCounts[o] = { completed: 0, remaining: 0 };
        if (t.status === 'completed') ownerCounts[o].completed++;
        else ownerCounts[o].remaining++;
    });
    const owners = Object.keys(ownerCounts).sort();

    new Chart(document.getElementById('chart-owner'), {
        type: 'bar',
        data: {
            labels: owners,
            datasets: [
                { label: 'Completed', data: owners.map(o => ownerCounts[o].completed), backgroundColor: '#10b981cc', borderRadius: 4 },
                { label: 'Remaining', data: owners.map(o => ownerCounts[o].remaining), backgroundColor: '#3b82f6cc', borderRadius: 4 },
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { usePointStyle: true, padding: 14, font: { size: 11 } } }
            },
            scales: {
                x: { stacked: true, grid: { display: false } },
                y: { stacked: true, beginAtZero: true, ticks: { stepSize: 10 } }
            }
        }
    });
}

/* ================================================================
   TIMELINE — Today through Monday
   ================================================================ */
function renderTimeline() {
    const container = document.getElementById('timeline');
    const allTasks = DATA.phases.flatMap(p => (p.tasks || []).map(t => ({ ...t, phaseName: p.name })));

    // Build days from today to Monday (Mar 9)
    const start = new Date(TODAY + 'T00:00:00');
    const end = new Date(DEADLINE + 'T00:00:00');
    const days = [];
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        days.push(d.toISOString().slice(0, 10));
    }

    // Also include tasks with no due_date that are in_progress
    const inProgressNoDue = allTasks.filter(t => t.status === 'in_progress' && !t.due_date);

    days.forEach(day => {
        const date = new Date(day + 'T00:00:00');
        const isToday = day === TODAY;
        const dayTasks = allTasks.filter(t =>
            t.due_date === day && t.status !== 'completed' && t.status !== 'deferred'
        );

        // On today, also show in-progress tasks with no due date
        const extraTasks = isToday ? inProgressNoDue : [];
        const showTasks = [...dayTasks, ...extraTasks];

        let html = '<div class="timeline-day">';
        html += '<div class="timeline-date' + (isToday ? ' today' : '') + '">';
        html += '<div class="timeline-date-label">' + fmtDate(day) + '</div>';
        html += '<div class="timeline-date-weekday">' + WEEKDAYS[date.getDay()] + (isToday ? ' (today)' : '') + '</div>';
        html += '</div>';
        html += '<div class="timeline-tasks">';

        if (showTasks.length === 0) {
            html += '<div style="color:var(--text-muted);font-size:0.8rem;padding:8px 0;">No tasks scheduled</div>';
        } else {
            showTasks.forEach(t => {
                html += '<div class="tl-task">';
                html += '<span class="tl-task-id">#' + t.id + '</span>';
                html += badgeHtml(t.status);
                html += priIcon(t.priority);
                html += '<span class="tl-task-subject">' + esc(t.subject) + '</span>';
                html += '<span class="tl-task-owner">@' + esc(t.owner || '?') + '</span>';
                html += '</div>';
            });
        }

        html += '</div></div>';
        container.innerHTML += html;
    });
}

/* ================================================================
   PHASES & TASKS — Multi-level cascading
   ================================================================ */
function renderPhases() {
    const container = document.getElementById('tab-phases');
    const active = DATA.phases.filter(p => p.status !== 'completed');
    const completed = DATA.phases.filter(p => p.status === 'completed');

    let html = '';

    if (active.length > 0) {
        html += '<div class="section-header">Active & Pending</div>';
        active.forEach(p => { html += phaseCardHtml(p, true); });
    }

    if (completed.length > 0) {
        html += '<div class="section-header">Completed (' + completed.length + ')</div>';
        completed.forEach(p => { html += phaseCardHtml(p, false); });
    }

    container.innerHTML = html;
}

function phaseCardHtml(phase, openByDefault) {
    const tasks = phase.tasks || [];
    const done = countTasks(tasks, 'completed');
    const openCls = openByDefault ? ' open' : '';

    let html = '<div class="phase-card' + openCls + '">';

    // Header
    html += '<div class="phase-header" onclick="togglePhase(this)">';
    html += '<svg class="phase-chevron" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>';
    html += '<span class="phase-title">' + esc(phase.name) + '</span>';
    if (tasks.length > 0) {
        html += '<span class="phase-counter">' + done + '/' + tasks.length + '</span>';
    }
    html += badgeHtml(phase.status);
    if (phase.due_date) html += '<span class="phase-due">' + fmtDate(phase.due_date) + '</span>';
    html += '</div>';

    // Body
    html += '<div class="phase-body">';
    if (phase.description) {
        html += '<div class="phase-desc">' + esc(phase.description) + '</div>';
    }

    if (tasks.length > 0) {
        html += '<div class="task-list">';
        tasks.forEach(t => {
            const od = isOverdue(t.due_date, t.status);
            html += '<div class="task-row" onclick="toggleTaskDetail(this)">';
            html += '<span class="task-id">#' + t.id + '</span>';
            html += badgeHtml(t.status);
            html += '<span class="task-subject">' + esc(t.subject) + '</span>';
            html += priIcon(t.priority);
            html += '<span class="task-owner">@' + esc(t.owner || '?') + '</span>';
            html += '<span class="task-due' + (od ? ' overdue' : '') + '">' + (t.due_date ? fmtDate(t.due_date) : '') + '</span>';
            html += '</div>';

            // Detail panel
            html += '<div class="task-detail"><div class="task-detail-inner">';
            if (t.description) {
                html += '<div class="td-row"><div class="td-label">Description</div>' + esc(t.description) + '</div>';
            }
            html += '<div class="td-row"><div class="td-label">Priority</div>' + t.priority + '</div>';
            if (t.completed_date) {
                html += '<div class="td-row"><div class="td-label">Completed</div>' + t.completed_date.slice(0, 10) + '</div>';
            }
            html += '</div></div>';
        });
        html += '</div>';
    }

    // Phase-level decisions
    const decisions = phase.decisions || [];
    if (decisions.length > 0) {
        html += '<div style="padding:0 18px 14px"><div class="td-label" style="margin-bottom:6px">Related Decisions</div>';
        decisions.forEach(d => {
            html += '<div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px">';
            html += '<span style="color:var(--blue);font-weight:700">' + d.id + '</span> ' + esc(d.title);
            html += ' ' + badgeHtml(d.status);
            html += '</div>';
        });
        html += '</div>';
    }

    html += '</div>'; // phase-body
    html += '</div>'; // phase-card
    return html;
}

function togglePhase(headerEl) {
    headerEl.parentElement.classList.toggle('open');
}

function toggleTaskDetail(rowEl) {
    const detail = rowEl.nextElementSibling;
    if (detail && detail.classList.contains('task-detail')) {
        detail.classList.toggle('open');
    }
}

/* ================================================================
   DECISIONS
   ================================================================ */
function renderDecisions() {
    const container = document.getElementById('tab-decisions');
    const implemented = DATA.decisions.filter(d => d.status === 'implemented');
    const active = DATA.decisions.filter(d => d.status === 'active');
    const pending = DATA.decisions.filter(d => d.status === 'pending');
    const deferred = DATA.decisions.filter(d => d.status === 'deferred');

    let html = '';
    const groups = [
        { label: 'Active', items: active },
        { label: 'Pending', items: pending },
        { label: 'Implemented', items: implemented },
        { label: 'Deferred', items: deferred },
    ];

    groups.forEach(g => {
        if (g.items.length === 0) return;
        html += '<div class="section-header">' + g.label + ' (' + g.items.length + ')</div>';
        g.items.forEach(d => {
            html += '<div class="decision-card" onclick="toggleDecision(this)">';
            html += '<span class="decision-id">' + d.id + '</span>';
            html += '<span class="decision-title">' + esc(d.title) + '</span>';
            html += badgeHtml(d.status);
            html += '<span class="decision-source">' + esc(d.source || '') + '</span>';
            html += '</div>';
            html += '<div class="decision-detail"><div class="decision-rationale">' + esc(d.rationale || 'No rationale recorded.') + '</div></div>';
        });
    });

    container.innerHTML = html;
}

function toggleDecision(el) {
    const detail = el.nextElementSibling;
    if (detail && detail.classList.contains('decision-detail')) {
        detail.classList.toggle('open');
    }
}

/* ================================================================
   ACTION ITEMS
   ================================================================ */
function renderActions() {
    const container = document.getElementById('tab-actions');
    let html = '<div class="section-header">Action Items (' + DATA.action_items.length + ')</div>';

    DATA.action_items.forEach(a => {
        html += '<div class="action-card">';
        html += '<span class="action-id">' + a.id + '</span>';
        html += badgeHtml(a.status);
        html += '<span class="action-desc">' + esc(a.description) + '</span>';
        html += '<span class="action-owner">@' + esc(a.owner) + '</span>';
        html += '<span class="action-deadline">' + (a.deadline ? fmtDate(a.deadline) : '') + '</span>';
        html += '</div>';
    });

    container.innerHTML = html;
}

/* ================================================================
   DEPENDENCIES
   ================================================================ */
function renderDeps() {
    const container = document.getElementById('tab-deps');
    if (!DATA.dependencies || DATA.dependencies.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);padding:20px">No dependencies.</p>';
        return;
    }

    // Group by blocked task
    const groups = {};
    DATA.dependencies.forEach(d => {
        if (!groups[d.task_id]) groups[d.task_id] = { subject: d.task_subject, blockers: [] };
        groups[d.task_id].blockers.push(d);
    });

    let html = '<div class="section-header">Dependency Graph (' + DATA.dependencies.length + ' edges)</div>';
    html += '<div style="background:var(--bg-panel);border:1px solid var(--border-color);border-radius:var(--radius);padding:8px 0">';

    Object.keys(groups).sort((a,b) => +a - +b).forEach(taskId => {
        const g = groups[taskId];
        g.blockers.forEach(d => {
            html += '<div class="dep-card">';
            html += '<span class="dep-task">#' + d.task_id + '</span> ';
            html += '<span>' + esc(d.task_subject) + '</span>';
            html += '<span class="dep-arrow">&larr; blocked by &larr;</span>';
            html += '<span class="dep-task">#' + d.depends_on + '</span> ';
            html += '<span>' + esc(d.depends_on_subject) + '</span>';
            html += '</div>';
        });
    });

    html += '</div>';
    container.innerHTML = html;
}

/* ================================================================
   BOOT
   ================================================================ */
init();
</script>
